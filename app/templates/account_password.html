{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>비밀번호 변경</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>현재 비밀번호
      <input class="field" type="password" name="current" required autocomplete="current-password"></label>
    <label>새 비밀번호 <span class="muted">(10자 이상)</span>
      <input class="field" type="password" name="new" minlength="10" required autocomplete="new-password"></label>
    <label>새 비밀번호 확인
      <input class="field" type="password" name="confirm" minlength="10" required autocomplete="new-password"></label>
    <button class="primary" type="submit">변경</button>
  </form>
  <p class="muted"><a href="{{ '/admin' if user.role.value == 'ADMIN' else '/' }}">돌아가기</a></p>
</section>
{% endblock %}
