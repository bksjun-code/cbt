# /etc/nginx/conf.d/ogg-cbt.conf  (또는 sites-available 에 두고 링크)
# server_name, 인증서 경로를 환경에 맞게 바꾸세요. 앱은 127.0.0.1:8000 으로만 열려 있어야 합니다.

# 로그인 시도 속도 제한: 같은 IP 에서 분당 10회(여유 burst 5). 계정 잠금(계정별)과 별개로 IP 단위 방어를 보완한다.
limit_req_zone $binary_remote_addr zone=cbt_login:10m rate=10r/m;

server {
    listen 80;
    server_name cbt.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cbt.example.com;

    ssl_certificate     /etc/ssl/certs/cbt.example.com.crt;
    ssl_certificate_key /etc/ssl/private/cbt.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 문항 업로드 상한 2MB 보다 약간 크게
    client_max_body_size 3m;
    # 응시자 일괄 등록(최대 100명, bcrypt 해시)이 수십 초 걸릴 수 있다
    proxy_read_timeout 90s;

    location ~ ^/(register|password/forgot)$ {
        limit_req zone=cbt_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_cbt;
    }

    location = /login {
        limit_req zone=cbt_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_cbt;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_cbt;
    }
}
